<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="calculator">
    <div id="answer">Modern Calculator</div> <br>
    <button class="leftside" onclick="seven()" class="click">7</button>
    <button class="leftside" onclick="eight()" class="click">8</button>
    <button class="leftside" onclick="nine()" class="click">9</button>
    <button class="rightside" onclick="divide()">/</button> <br>
    <button class="leftside" onclick="four()">4</button>
    <button class="leftside" onclick="five()">5</button>
    <button class="leftside" onclick="six()">6</button>
    <button class="rightside" onclick="multiply()">*</button> <br>
    <button class="leftside" onclick="one()">1</button>
    <button class="leftside" onclick="two()">2</button>
    <button class="leftside" onclick="three()">3</button>
    <button class="rightside" onclick="subtraction()">-</button> <br>
    <button class="leftside" onclick="zero()">0</button>
    <button class="leftside" onclick="dot()">.</button>
    <button class="leftside" onclick="equalto()">=</button>
    <button class="rightside" onclick="addition()">+</button> <br>
    <button class="bottomside" onclick="del()">DEL</button>
    <button class="bottomside" onclick="clearall()">C</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
